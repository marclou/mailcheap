# Mailcheap + MongoDB with Docker Compose. Works as-is on Coolify (Docker Compose build pack) and with
# plain `docker compose up -d` on any server. See the README's "Docker" section.
#
# Variables written ${NAME:?...} are required. Set them in a .env file next to this one, or in Coolify's
# Environment Variables tab, where every variable below shows up.
#
# No port is published: put a reverse proxy with HTTPS in front (Coolify's proxy does this for you).
# To try it locally, add `ports: ["127.0.0.1:3000:3000"]` under `app`.

services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mailcheap:${MONGO_PASSWORD:?Set MONGO_PASSWORD (openssl rand -hex 24)}@mongo:27017/mailcheap?authSource=admin
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (12+ characters)}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (openssl rand -base64 48)}
      APP_URL: ${APP_URL:?Set APP_URL, the public https URL of this app}
      SENDING_ENABLED: ${SENDING_ENABLED:-false}
      SES_REGION: ${SES_REGION:-us-east-1}
      SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID:-}
      SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      SES_SNS_TOPIC_ARN: ${SES_SNS_TOPIC_ARN:-}
      SEND_RATE_PER_SECOND: ${SEND_RATE_PER_SECOND:-}
      QSTASH_TOKEN: ${QSTASH_TOKEN:-}
      QSTASH_CURRENT_SIGNING_KEY: ${QSTASH_CURRENT_SIGNING_KEY:-}
      QSTASH_NEXT_SIGNING_KEY: ${QSTASH_NEXT_SIGNING_KEY:-}
      QSTASH_URL: ${QSTASH_URL:-}
      ARCHIVE_HOSTS: ${ARCHIVE_HOSTS:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      ALERT_FROM: ${ALERT_FROM:-}
      # Optional SMTP instead of SES (Stalwart, Postfix...). See lib/smtp.js for what you give up.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_VERIFY: ${SMTP_TLS_VERIFY:-true}
      SMTP_DOMAINS: ${SMTP_DOMAINS:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mailcheap
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD (openssl rand -hex 24)}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  mongo-data:
